<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ===== META & SEO ===== -->
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Amr Essam - A Wolf Brand 2026"/>
  <link rel="icon" href="images/wolf-a-logo.png"/>
  <title>Amr Essam — A.ESSAM</title>

  <!-- ===== FONTS ===== -->
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- ======================
     SIDEBAR - القائمة الجانبية
======================= -->
<aside class="side">
  <!-- لوجو صغير فوق (بيختفي في الموبايل) -->
  <div class="brand-mini">
    <img src="images/wolf-a-logo.png" alt="Wolf Logo"/>
    <span>A.ESSAM</span>
  </div>

  <!-- روابط الأقسام -->
  <ul>
    <li><a href="#main" data-t="main" class="active">MAIN</a></li>
    <li><a href="#about" data-t="about">ABOUT ME</a></li>
    <li><a href="#logo" data-t="logo">LOGO</a></li>
    <li><a href="#cars" data-t="cars">CAR POSTERS</a></li>
    <li><a href="#clients" data-t="clients">CLIENT WORK</a></li>
    <li><a href="#contact" data-t="contact">CONTACT</a></li>
    <li class="dev-link"><a href="https://amressam.is-a.dev" target="_blank">→ DEV PORTFOLIO</a></li>
  </ul>
</aside>

<!-- ======================
     STAGE - منطقة العرض
======================= -->
<main class="stage">

  <!-- MAIN SECTION -->
  <section class="panel active" id="main">
    <div class="hero">
      <p class="year">20<b>26</b></p>
      <h1 class="giant"><span class="w">port</span><span class="y">folio</span></h1>
      <p class="role">GRAPHICS <b>+ CODE</b></p>
      <p class="name">Amr Essam — A Wolf Brand</p>
    </div>
    <!-- صورة البورتريه: لو مش موجودة هتختفي لوحدها -->
    <img class="cutout" src="images/avatar-cutout.png" alt="" onerror="this.style.display='none'"/>
  </section>

  <!-- ABOUT -->
  <section class="panel" id="about">
    <h2 class="title"><span class="w">ABOUT</span> <span class="y">ME!</span></h2>
    <p>Founder of A Wolf Brand - Graphic Designer from Egypt.</p>
  </section>

  <!-- LOGO GALLERY -->
  <section class="panel" id="logo">
    <h2 class="title"><span class="w">LO</span><span class="y">GO</span></h2>
    <div class="grid g3 sq">
      <figure class="featured">
        <img src="images/wolf-a-logo.png" alt="Wolf Brand"/>
        <figcaption>A Wolf - Main 2026</figcaption>
      </figure>
    </div>
  </section>

  <!-- باقي الأقسام -->
  <section class="panel" id="cars"><h2 class="title"><span class="w">CAR</span> <span class="y">POSTERS!</span></h2></section>
  <section class="panel" id="clients"><h2 class="title"><span class="w">CLIENT</span> <span class="y">WORK</span></h2></section>
  <section class="panel" id="contact"><h2 class="title"><span class="w">GET IN</span> <span class="y">TOUCH</span></h2></section>

</main>

<script src="script.js"></script>
</body>
</html>
